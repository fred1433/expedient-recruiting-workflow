# Local test bench for the physician inquiry workflow.
# n8n is pinned to an exact version; Postgres holds both the n8n database and the
# recovery ledger (schema "recruiting"), so one backup covers both.
#
#   docker compose up -d            # n8n + postgres + simulator
#   N8N_STACK=restore docker compose -p expedient-restore ...   # clean instance for the restore drill
#
name: ${COMPOSE_PROJECT_NAME:-expedient}

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n8n-local-only}
      POSTGRES_DB: n8n
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-recruiting.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.2
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-n8n-local-only}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      GENERIC_TIMEZONE: America/Los_Angeles
      TZ: America/Los_Angeles
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      # Workflow settings read through $env (see README, "Configuration")
      HUBSPOT_BASE_URL: ${HUBSPOT_BASE_URL:-http://simulator:4010}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-http://simulator:4010}
      MODEL_NAME: ${MODEL_NAME:-gpt-5.4-mini-2026-03-17}
      RECRUITING_OWNER_ID: ${RECRUITING_OWNER_ID:-900001}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://simulator:4010/__alerts}
      POLL_TRIGGER_TOKEN: ${POLL_TRIGGER_TOKEN:-local-test-token}
      LEASE_SECONDS: ${LEASE_SECONDS:-300}
      RETRY_BASE_SECONDS: ${RETRY_BASE_SECONDS:-30}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-5}
      POLL_OVERLAP_MINUTES: ${POLL_OVERLAP_MINUTES:-10}
      JOIN_FORM_NAME: ${JOIN_FORM_NAME:-Join Expedient}
    volumes:
      - n8ndata:/home/node/.n8n
      - ./workflows:/import/workflows:ro
      - ./ops/runtime:/import/runtime
    restart: unless-stopped

  simulator:
    image: node:22-alpine
    working_dir: /sim
    command: ["node", "sim.mjs"]
    ports:
      - "${SIM_PORT:-4010}:4010"
    volumes:
      - ./simulator:/sim:ro
    restart: unless-stopped

volumes:
  pgdata:
  n8ndata:
